name: No Animal Violence Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Commit on the action's main branch from 2026-04-09; it has no release tag.
      - uses: Open-Paws/no-animal-violence-action@4dd17909ccdb87b4174dacae1a8e157aa09a17ef # main @ 2026-04-09
